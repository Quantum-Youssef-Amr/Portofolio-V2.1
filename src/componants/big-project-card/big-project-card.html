<div class="project-card flex-column appCard">
    @if(Project.projectMainImage !== ""){
      <img class="project-image" [src]="Project.projectMainImage">
    }
    <div class="p1">
      <a class="link" (click)="OnClickLink()">
        <h3 class="title mb05 link">{{Project.projectName}}</h3>
      </a>
      <h5 class="text-holder subtitle">{{Project.projectDescription[0]}}</h5>
    </div>
</div>
