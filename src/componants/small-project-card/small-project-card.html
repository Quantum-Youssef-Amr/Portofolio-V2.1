<div class="appCard flex-column p1" [class.centered]="Project.projectDescription.length === 0 && Project.projectTech.length === 0">
  <span class="titleHolder">
    <span class="langsHolder">
      @if(Project.projectTech.length > 0){
        @for (image of Project.projectTech; track $index) {
          <img [src]="image">
        }
      }
    </span>
    <a class="link title" [href]="ProjectLink">
      {{Project.projectName}}
    </a>
  </span>
  @if(Project.projectDescription.length > 0){
    <h5 class="subtitle">{{Project.projectDescription[0]}}</h5>
  }
</div>
