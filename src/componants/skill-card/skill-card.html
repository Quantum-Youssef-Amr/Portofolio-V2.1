<div class="appCard flex-column p1">
  <div class="lang m1">
    @if(Image !== ""){
      <img [class.gray]="gray" [src]="Image">
    }
    <h3 class="subtitle">{{Title}}</h3>
  </div>
  <div class="progressbar">
    <div class="fill" [style.--progress]="progress / 10"></div>
  </div>
  <div><h3 class="subtitle fevCol m1">{{progress}} / 10</h3></div>
</div>
