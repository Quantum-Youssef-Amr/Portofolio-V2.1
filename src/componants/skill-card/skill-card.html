<div class="appCard flex-column p1" [style.--progress]="progress / 10" [class.full] = "progress == 10">
  @if (Note.length > 0) {
    <div class="centered p1 noteCard">
      <h3 class="full">{{Note}}</h3>
    </div>
  }

  <div class="lang m1">
    @if(Image !== ""){
      <img [class.gray]="gray" [src]="Image" alt="{{Title}}" loading="lazy"/>
    }
    <h3 class="subtitle z-inh">{{Title}}</h3>
  </div>
  <div><h3 class="titleSize fevCol m1 z-inh">{{progress}} / 10</h3></div>
</div>
