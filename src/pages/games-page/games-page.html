<main class="flex flex-column gap2 m1 mt3">
    <div class="wid90 mb1">
      <app-paragraph [Title]="PageContent.title"></app-paragraph>
      <div class="flex flex-wrap gap2">
        @for (project of PageContent.projects; track $index) {
          <app-big-project-card [ProjectType]="'Game'" [ProjectImage]="project.projectMainImage" [ProjectName]="project.projectName" [ProjectDescription]="project.projectDescription[0]"></app-big-project-card>
        }
      </div>
    </div>
  <div class="flex flex-column gap1">
    <h2>Wanna see more ?</h2>
    <div class="flex flex-column">
      <h3 class="m1 mb1">visit my itch</h3>
      <app-btn-with-image [Image]="`assets/Social/Itch.svg`" [link]="'https://youssef-amr0.itch.io/'" [Title]="`Itch`"> </app-btn-with-image>
    </div>
  </div>
</main>
