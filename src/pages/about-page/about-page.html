<main class="flex flex-column flex-center main">
  <div class="stack-container hero">
    <div class="flex imgs">
      <div class="img-left-side full-height"></div>
      <div class="img-right-side full-height"></div>
    </div>
    <div class="gradient"></div>
    <app-contacts-card></app-contacts-card>

  }
  <app-timeline class="wid90" [Timeline]="TimelineData"></app-timeline>
</main>
<div class="squares"></div>
